[package]
description = "Throwaway probe: FO4Edit Module Selection dismissal and close behaviour on Windows (map ticket #40)"
edition = "2024"
name = "fo4edit-window-probe"
publish = false
version = "0.0.0"

# An empty workspace table detaches this probe from any parent workspace, so it never joins the
# main crate's build and its `unsafe` never meets the main crate's `unsafe_code = "forbid"`.
[workspace]

[dependencies]
clap = {version = "4.5", features = ["derive"]}
serde = {version = "1.0", features = ["derive"]}
serde_json = "1.0"
winreg = "0.52"

[dependencies.windows]
features = [
  "Win32_Foundation",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
]
version = "0.62"
