[package]
description = "Throwaway probe: archive rebuild round trips and the work-folder swap on Windows (map ticket #44)"
edition = "2024"
name = "archive-roundtrip-probe"
publish = false
version = "0.0.0"

# An empty workspace table detaches this probe from any parent workspace, so it never joins the
# main crate's build and its `unsafe` never meets the main crate's `unsafe_code = "forbid"`.
[workspace]

[dependencies]
clap = {version = "4.5", features = ["derive"]}
flate2 = "1.0"
serde_json = "1.0"
winreg = "0.52"

[dependencies.windows]
features = ["Win32_Foundation", "Win32_System_LibraryLoader"]
version = "0.62"
